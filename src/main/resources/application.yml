spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:parceldb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 8080
