services:
  parcel-api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/parcel
      DB_USER: parcel
      DB_PASSWORD: parcel_dev
    depends_on: [postgres]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: parcel
      POSTGRES_USER: parcel
      POSTGRES_PASSWORD: parcel_dev
    ports: ["5432:5432"]
    volumes: [parcel_data:/var/lib/postgresql/data]
volumes:
  parcel_data:
